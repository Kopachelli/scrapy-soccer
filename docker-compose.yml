version: '3.8'

services:
  # Main scraper application
  scraper:
    build: .
    container_name: soccer-scraper
    environment:
      - DB_HOST=mysql
      - DB_USER=soccer_user
      - DB_PASS=soccer_pass
      - DB_NAME=soccer_db
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    depends_on:
      - mysql
      - redis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./httpcache:/app/httpcache
    restart: unless-stopped
    networks:
      - soccer-network

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: soccer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: soccer_db
      MYSQL_USER: soccer_user
      MYSQL_PASSWORD: soccer_pass
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - soccer-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: soccer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - soccer-network
    command: redis-server --appendonly yes

  # Nginx reverse proxy (for future API)
  nginx:
    image: nginx:alpine
    container_name: soccer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - scraper
    restart: unless-stopped
    networks:
      - soccer-network

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: soccer-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - soccer-network

  # Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: soccer-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - soccer-network

  # Backup service
  backup:
    image: alpine:latest
    container_name: soccer-backup
    volumes:
      - ./backup:/backup
      - mysql_data:/var/lib/mysql:ro
    environment:
      - DB_HOST=mysql
      - DB_USER=soccer_user
      - DB_PASS=soccer_pass
      - DB_NAME=soccer_db
    depends_on:
      - mysql
    command: |
      sh -c '
        apk add --no-cache mysql-client
        while true; do
          echo "Starting backup at $(date)"
          mysqldump -h mysql -u soccer_user -psoccer_pass soccer_db > /backup/backup_$(date +%Y%m%d_%H%M%S).sql
          gzip /backup/backup_*.sql
          echo "Backup completed at $(date)"
          sleep 86400
        done
      '
    restart: unless-stopped
    networks:
      - soccer-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  soccer-network:
    driver: bridge